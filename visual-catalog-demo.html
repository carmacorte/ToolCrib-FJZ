<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool Crib · Catálogo visual piloto</title><style>body{font:16px system-ui;background:#f1f5f9;color:#14253d;margin:0}header{background:#10223b;color:white;padding:24px}main{max-width:1000px;margin:30px auto;padding:0 18px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 3px 20px #1a34551c}input{padding:12px;border:1px solid #cad3e0;border-radius:8px;width:100%;box-sizing:border-box}button{background:#1769ce;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}.item{border:1px solid #dbe3ee;border-radius:12px;padding:15px}.photo{width:100%;height:160px;object-fit:contain;background:#edf2f7;border-radius:8px}.muted{color:#64748b}.warning{color:#9a5800}h1{margin:0}small{color:#b9c9dd}</style></head><body><header><h1>Tool Crib · Catálogo visual</h1><small>Piloto de asociación SKU → fotografía · Sin datos reales</small></header><main><section class="card"><h2>Buscar refacción</h2><input id="search" placeholder="Buscar SKU o descripción"><p class="muted">La información visual proviene de assets/materials y data/materials-images.json. Esta página es un visor de prueba, no reemplaza Tool Crib V8.</p><div id="status"></div><div class="grid" id="results"></div></section></main><script src="js/image-resolver.js"></script><script>
const search=document.querySelector('#search'),results=document.querySelector('#results'),status=document.querySelector('#status');let catalog={};
function render(){const q=search.value.toUpperCase().trim();results.replaceChildren();for(const [sku,entry] of Object.entries(catalog).filter(([s,e])=>s.includes(q)||e.description.toUpperCase().includes(q))){const card=document.createElement('div');card.className='item';const h=document.createElement('h3');h.textContent=sku;card.append(h);if(entry.main){const img=document.createElement('img');img.className='photo';img.alt='Fotografía de '+sku;img.src=entry.main;img.onerror=()=>{img.replaceWith(document.createTextNode('Fotografía pendiente de cargar'))};card.append(img);}const p=document.createElement('p');p.textContent=entry.description;card.append(p);const v=document.createElement('strong');v.className=entry.verified?'':'warning';v.textContent=entry.verified?'Fotografía verificada':'Imagen sin verificar / pendiente';card.append(v);results.append(card);}if(!results.children.length)status.textContent='Sin coincidencias';else status.textContent=results.children.length+' material(es)';}
search.addEventListener('input',render);ToolCribImages.loadCatalog().then(x=>{catalog=x;render()}).catch(e=>{status.textContent=e.message+' · Abrir mediante HTTP/HTTPS, no file://'});
</script></body></html>
